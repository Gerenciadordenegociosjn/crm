kind = "video"
previewPath = "/training-video/"
title = "Treinamento Mapey CRM"
description = "Vídeo animado de treinamento para a equipe — apresenta as funcionalidades do sistema Mapey CRM para administradores e vendedores."
version = "1.0.0"
id = "artifacts/training-video"
router = "path"

[[services]]
name = "web"
paths = [ "/training-video/" ]
localPort = 21092

[services.development]
run = "pnpm --filter @workspace/training-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/training-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/training-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21092"
BASE_PATH = "/training-video/"
